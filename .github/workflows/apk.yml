ZIP
Gerei o pacote completo em um único ZIP, slide-puzzle-pwa-apk-v1.1.0.zip. O ZIP abre sem erro, o JavaScript passa na checagem de sintaxe e o YAML do workflow é lido corretamente. Não testei o jogo rodando nem o build do APK.

Conteúdo do ZIP
Jogo (PWA): index.html, style.css, app.js, sw.js, manifest.webmanifest e a pasta icons/ com 3 ícones. Inclui o Top 10 com destaque do último jogo.

Para o APK:

package.json e capacitor.config.json (pacote com.willianrocha.slidepuzzle).

.github/workflows/apk.yml, que compila e assina o APK. O versionCode sobe sozinho a cada execução.

.gitignore, que impede o envio da chave por engano.

Documentação: README.md com o passo a passo e LICENSE (MIT).

A versão do jogo continua em 1.1.0 (18/10/2026), porque só mudou o empacotamento.

O que fazer
Extraia o ZIP e envie todos os arquivos para a raiz do repositório. Inclua a pasta oculta .github, que costuma ficar de fora no upload pelo navegador. Se isso acontecer, crie o arquivo apk.yml direto no GitHub, em Add file → Create new file, digitando o caminho .github/workflows/apk.yml.

Crie a chave (release.jks) e os 4 secrets, como descrito no README.md: KEYSTORE_BASE64, KS_PASS, KEY_PASS e KEY_ALIAS.

Na aba Actions, rode "Build APK" e baixe o arquivo em Artifacts.

Guarde um backup da chave. Sem ela você não consegue atualizar o app por cima e precisa desinstalar.

