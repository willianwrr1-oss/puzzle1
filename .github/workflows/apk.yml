YAML
Aqui está o apk.yml completo e corrigido. Ele vai também como arquivo anexo, e o YAML foi validado (10 etapas, sem erro de formato). Cole o conteúdo no arquivo .github/workflows/apk.yml.

text
name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: |
          mkdir www
          cp index.html style.css app.js sw.js manifest.webmanifest www/
          cp -r icons www/
      - run: |
          npx cap add android
          npx cap sync android
      - name: Versão
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
      - run: cd android && ./gradlew assembleRelease
      - name: Assinar
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KS_B64 KS_PASS KEY_PASS KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "Secret vazio: $v"; exit 1; fi
          done
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out SlidePuzzlePro.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlidePuzzlePro-apk
          path: SlidePuzzlePro.apk
Mudanças em relação à versão anterior
A etapa "Assinar" agora lê os secrets por variáveis e usa aspas. Se algum secret estiver vazio, o log mostra "Secret vazio: NOME" e para, em vez de dar o erro confuso.

O setup-java passou para a versão 5, o que elimina um dos avisos amarelos.

Depois de salvar, rode Run workflow de novo. Se aparecer "Secret vazio", crie ou corrija esse secret e rode outra vez.

