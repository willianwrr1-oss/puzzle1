name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: |
          mkdir www
          cp index.html style.css app.js sw.js manifest.webmanifest www/
          cp -r icons www/
      - run: |
          npx cap add android
          npx cap sync android
      - name: Versão
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
      - run: cd android && ./gradlew assembleRelease
      - name: Assinar
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks release.jks \
            --ks-pass pass:${{ secrets.KS_PASS }} --key-pass pass:${{ secrets.KEY_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out SlidePuzzlePro.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SlidePuzzlePro-apk
          path: SlidePuzzlePro.apk
