name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Copiar arquivos web
        run: |
          mkdir www
          cp index.html style.css app.js sw.js manifest.webmanifest www/
          cp -r icons www/

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Versao
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle

      - name: Compilar
        run: cd android && ./gradlew assembleRelease

      - name: Assinar
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.jks
          PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n')
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias slidepuzzle --out SlidePuzzlePro.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SlidePuzzlePro-apk
          path: SlidePuzzlePro.apk
